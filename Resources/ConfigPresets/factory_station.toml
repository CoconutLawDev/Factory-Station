[preset]
name = "FactoryStation Rules"
description = "Правила сервера FactoryStation"

[rules]
1 = "Не будь мудаком. Уважай других игроков, не порти им игру намеренно."
2 = "Запрещены язык вражды, разжигание ненависти, оскорбления по расовому, национальному, религиозному или иным признакам."
3 = "ERP и контент сексуального характера строго запрещены."
4 = "Мультиаккаунтинг (использование нескольких учётных записей для игры на сервере) запрещён."
5 = "Слушайтесь администрацию. Решение администратора окончательно, даже если оно не описано в правилах."
6 = "Запрещено использовать баги и эксплойты. О найденных уязвимостях сообщайте администраторам."
7 = "Не выдавайте себя за администрацию или других игроков."
8 = "Используйте адекватные никнеймы. Запрещены провокационные, нечитаемые или рекламные имена."
9 = "Реклама сторонних серверов, сайтов, Discord-каналов без согласования с хостом запрещена."
10 = "Общение в OOC (Out of Character) должно оставаться дружелюбным."
11 = "Наш Discord: https://discord.gg/CexPKzqdT2"
12 = "Исходный код и баг-репорты: https://github.com/CoconutLawDev/Factory-Station"
