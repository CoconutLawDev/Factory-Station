- type: entity
  id: Furnace
  parent: BaseLatheLube
  name: Промышленная печь
  description: "Промышленная печь используется для выплавки руды в слитки."
  components:
  - type: Sprite
    sprite: _FactoryStation/Machines/smelter.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
  - type: Machine
    board: FurnaceMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
      capacity: 500
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: burning
    staticPacks:
      - IngotIronRecipe
  - type: AutoCollector
    interval: 0.5
    pullForce: 25.0
    collectionRadius: 0.7
  - type: ActiveRecipe
    enabled: true
  - type: FactoryIndustrialHeat
    maxHeat: 1500
    heatPerSecond: 12
    cooldownPerSecond: 10
    smokeThreshold: 300
    dangerThreshold: 700
    criticalThreshold: 1100
    smokeInterval: 3
    runningSound:
      path: /Audio/Machines/circuitprinter.ogg
    atmosHeatPerSecond: 25
    co2PerSecond: 0.25
    explosionChance: 0.05
    explosionIntensity: 50
    explosionSlope: 3
    explosionMaxTileIntensity: 10
    damagePerSecondCritical: 15
    alarmSound:
      path: /Audio/_FactoryStation/alertfactory1.ogg
    spillageInterval: 5
    spillagePrototype: PuddleFactoryLubricant
    spillageChance: 0.4
    emitsSparks: true
    # Включение атмосферного охлаждения
    ambientCoolingEnabled: true
    ambientCoolingCoefficient: 0.8   # сильное охлаждение от холодного воздуха
    roomTemperature: 293.15         # 20°C — выше не охлаждается
    minAmbientTemperature: 73.15    # -200°C — предел эффективности
    requireAtmosphereForCooling: true
