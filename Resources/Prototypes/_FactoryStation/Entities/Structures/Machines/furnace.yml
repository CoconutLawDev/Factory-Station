- type: entity
  id: Furnace
  parent: BaseLatheLube
  name: Промышленная печь
  description: "Промышленная печь используется для выплавки руды в слитки. Она может обрабатывать большие объемы материалов, что делает её незаменимой в производственных процессах."
  components:
  - type: Sprite
    sprite: _FactoryStation/Machines/smelter.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]   # Этот слой будет меняться на burning
  - type: Machine
    board: FurnaceMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: OreSiloClient
  - type: Lathe
    idleState: icon          # Когда стоит на месте
    runningState: burning
    staticPacks:
    - IngotIronRecipe

