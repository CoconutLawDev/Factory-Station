- type: entity
  id: Furnace
  parent: BaseLatheLube
  name: Промышленная печь
  description: "Промышленная печь используется для выплавки руды в слитки."
  components:

  - type: Sprite
    sprite: _FactoryStation/Machines/smelter.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]

  - type: Machine
    board: FurnaceMachineCircuitboard

  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
      capacity: 500

  - type: OreSiloClient

  - type: Lathe
    idleState: icon
    runningState: burning
    staticPacks:
      - IngotIronRecipe

  - type: AutoCollector
    interval: 0.5
    pullForce: 25.0
    collectionRadius: 0.7

  - type: ActiveRecipe
    enabled: true

  - type: FactoryIndustrialHeat
    maxHeat: 1500
    heatPerSecond: 55
    cooldownPerSecond: 8
    smokeThreshold: 200
    dangerThreshold: 900
    smokeInterval: 3

    runningSound:
      path: /Audio/Machines/circuitprinter.ogg


- type: entity
  id: Furnace2
  parent: BaseLatheLube
  name: Промышленная печь 2.0
  description: "Промышленная печь 2.0 раюотает в два раза быстрее."
  components:
  - type: Sprite
    sprite: _FactoryStation/Machines/smelter2.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]   # Этот слой будет меняться на burning
  - type: Machine
    board: FurnaceMachineCircuitboard2
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
      capacity: 500
  - type: OreSiloClient
  - type: Lathe
    idleState: icon          # Когда стоит на месте
    runningState: burning
    staticPacks:
    - IngotIronRecipe2
  - type: AutoCollector
    interval: 0.5          # интервал проверки (секунды)
    pullForce: 25.0        # сила подтягивания предметов
    collectionRadius: 0.7  # радиус захвата (0.7 ~ один тайл)

