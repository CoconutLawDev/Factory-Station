- type: entity
  id: Packer711
  parent: BaseLatheLube
  name: Промышленный упаковщик материалов 711
  description: "Промышленный упаковщик материалов 711 используется для упаковки материалов. Он может обрабатывать большие объемы материалов, что делает его незаменимым в производственных процессах."
  components:
  - type: Sprite
    sprite: _FactoryStation/Machines/packer.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
  - type: Machine
    board: PackerMachineCircuitboard711
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
      capacity: 500
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: burning
    staticPacks:
    - PackFactory
  - type: AutoCollector
    interval: 0.5
    pullForce: 25.0
    collectionRadius: 0.7
  - type: ActiveRecipe
    enabled: true
  - type: FactoryIndustrialHeat
    maxHeat: 1400
    heatPerSecond: 8
    cooldownPerSecond: 10
    smokeThreshold: 320
    dangerThreshold: 720
    criticalThreshold: 1080
    smokeInterval: 3
    runningSound:
      path: /Audio/Machines/circuitprinter.ogg
    atmosHeatPerSecond: 22
    co2PerSecond: 0.22
    explosionChance: 0.04
    explosionIntensity: 45
    explosionSlope: 3
    explosionMaxTileIntensity: 9
    damagePerSecondCritical: 14
    alarmSound:
      path: /Audio/_FactoryStation/alertfactory1.ogg   # убедитесь, что звук существует
    spillageInterval: 5
    spillagePrototype: PuddleFactoryLubricant
    spillageChance: 0.4
    emitsSparks: true
  - type: ItemSlots
    slots:
      heat_sink:
        name: Радиаторная пластина
        whitelist:
          components:
          - HeatSink
