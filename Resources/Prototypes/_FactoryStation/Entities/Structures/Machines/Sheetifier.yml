- type: entity
  id: SheetifierFactory3001
  parent: BaseLatheLube
  name: Лист-мастер 3001
  description: "Лист-мастер 3001 используется для обработки материалов в листы. Он может обрабатывать большие объемы материалов, что делает его незаменимым в производственных процессах."
  components:
  - type: Sprite
    sprite: _FactoryStation/Machines/sheetifier.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
  - type: Machine
    board: SheetifierMachineCircuitboard3001
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
        - OreSandstoneFact
      capacity: 250
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: burning
    staticPacks:
    - SheetifierRecipe3001
  - type: AutoCollector
    interval: 0.5
    pullForce: 25.0
    collectionRadius: 0.7
  - type: ActiveRecipe
    enabled: true
  - type: FactoryIndustrialHeat
    maxHeat: 1300
    heatPerSecond: 8
    cooldownPerSecond: 12
    smokeThreshold: 350
    dangerThreshold: 750
    criticalThreshold: 1100
    smokeInterval: 4
    runningSound:
      path: /Audio/Machines/circuitprinter.ogg
    atmosHeatPerSecond: 20
    co2PerSecond: 0.2
    explosionChance: 0.03
    explosionIntensity: 40
    explosionSlope: 3
    explosionMaxTileIntensity: 8
    damagePerSecondCritical: 12
    alarmSound:
      path: /Audio/_FactoryStation/alertfactory1.ogg   # убедитесь, что звук существует
    spillageInterval: 5
    spillagePrototype: PuddleFactoryLubricant
    spillageChance: 0.4
    emitsSparks: true
  - type: ItemSlots
    slots:
      heat_sink:
        name: Радиаторная пластина
        whitelist:
          components:
          - HeatSink

