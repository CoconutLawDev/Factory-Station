- type: entity
  id: Shaper261
  parent: BaseLatheLube
  name: Промышленный формировщик 261
  description: "Промышленный формировщик 261 используется для формирования материалов. Он может обрабатывать большие объемы материалов, что делает его незаменимым в производственных процессах."
  components:
  - type: Sprite
    sprite: _FactoryStation/Machines/shaper.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]   # Этот слой будет меняться на burning
  - type: Machine
    board: ShaperMachineCircuitboard261
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
      capacity: 500
  - type: OreSiloClient
  - type: Lathe
    idleState: icon          # Когда стоит на месте
    runningState: burning
    staticPacks:
    - IngotIronRecipe
  - type: AutoCollector
    interval: 0.5          # интервал проверки (секунды)
    pullForce: 25.0        # сила подтягивания предметов
    collectionRadius: 0.7  # радиус захвата (0.7 ~ один тайл)


