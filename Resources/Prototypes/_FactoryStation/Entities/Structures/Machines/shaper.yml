- type: entity
  id: Shaper261
  parent: BaseLatheLube
  name: Промышленный формировщик 261
  description: "Промышленный формировщик 261 используется для формирования материалов. Он может обрабатывать большие объемы материалов, что делает его незаменимым в производственных процессах."
  components:
  - type: Sprite
    sprite: _FactoryStation/Machines/shaper.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
  - type: Machine
    board: ShaperMachineCircuitboard261
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
      capacity: 500
  - type: OreSiloClient
  - type: Lathe
    idleState: icon
    runningState: burning
    staticPacks:
    - IngotIronRecipe
    - ClothPackFactory
  - type: AutoCollector
    interval: 0.5
    pullForce: 25.0
    collectionRadius: 0.7
  - type: ActiveRecipe
    enabled: true
  - type: FactoryIndustrialHeat
    maxHeat: 1350
    heatPerSecond: 11
    cooldownPerSecond: 11
    smokeThreshold: 340
    dangerThreshold: 740
    criticalThreshold: 1120
    smokeInterval: 4
    runningSound:
      path: /Audio/Machines/circuitprinter.ogg
    atmosHeatPerSecond: 21
    co2PerSecond: 0.21
    explosionChance: 0.04
    explosionIntensity: 42
    explosionSlope: 3
    explosionMaxTileIntensity: 9
    damagePerSecondCritical: 13
    alarmSound:
      path: /Audio/_FactoryStation/alertfactory1.ogg   # убедитесь, что звук существует
    spillageInterval: 5
    spillagePrototype: PuddleFactoryLubricant
    spillageChance: 0.4
    emitsSparks: true
  - type: ItemSlots
    slots:
      heat_sink:
        name: Радиаторная пластина
        whitelist:
          components:
          - HeatSink
