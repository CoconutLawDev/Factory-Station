# Железная руда
- type: entity
  abstract: true
  parent: BaseSheet
  id: SheetFactoryOreIronBase
  description: несколько кусков железной руды, используемых в различных приложениях на станции.
  components:
  - type: Sprite
    sprite: _FactoryStation/Items/Materials/iron_ore.rsi
  - type: Item
    sprite: _FactoryStation/Items/Materials/iron_ore.rsi
  - type: Tag
    tags:
    - OreIronFact
    - RawMaterial
    - Sheet
  - type: Damageable
    damageModifierSet: Metallic
  - type: GuideHelp
    guides:
    - ExpandingRepairingStation

- type: entity
  parent: SheetFactoryOreIronBase
  id: OreIronSheet
  name: "железная руда"
  suffix: Full
  components:
  - type: Material
    removed: true
  - type: PhysicalComposition
    materialComposition:
      OreIronFact: 100 # Проблема в том, что руда сразу считается железом ( листами), если пытаться исправить, то печь не будет принимать руду
  - type: Stack
    stackType: OreIronSheet
    baseLayer: icon
    layerStates:
    - icon
    - icon
  - type: Sprite
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    heldPrefix: OreIronSheet
  - type: Solution
    solution:
      reagents:
      - ReagentId: Iron
        Quantity: 9
      - ReagentId: Carbon
        Quantity: 1
  - type: Tag
    tags:
    - OreIronFact
    - RawMaterial
    - Sheet
    - Ore

- type: entity
  parent: OreIronSheet
  id: OreIronSheet10
  name: "железная руда"
  suffix: 10
  components:
  - type: Sprite
    state: icon
  - type: Stack
    stackType: OreIronSheet
    count: 10

- type: entity
  parent: OreIronSheet
  id: OreIronSheet1
  name: "железная руда"
  suffix: Single
  components:
  - type: Sprite
    state: icon
  - type: Stack
    stackType: OreIronSheet
    count: 1


