# Железные слитки и их производные для использования в различных приложениях на станции, таких как производство инструментов, конструкций и других изделий.
- type: entity
  abstract: true
  parent: BaseSheet
  id: SheetFactoryInfotsBase
  description: слиток металла, используемый в различных приложениях на станции.
  components:
  - type: Sprite
    sprite: _FactoryStation/Items/Materials/iron_ingot.rsi
  - type: Item
    sprite: _FactoryStation/Items/Materials/iron_ingot.rsi
  - type: Tag
    tags:
    - Ingot
    - IngotIron
    - RawMaterial
    - Sheet
  - type: Damageable
    damageModifierSet: Metallic
  - type: GuideHelp
    guides:
    - ExpandingRepairingStation

- type: entity
  parent: SheetFactoryInfotsBase
  id: IngotIronSheet
  name: "железный слиток"
  suffix: Full
  components:
  - type: Material
    removed: true
  - type: PhysicalComposition
    materialComposition:
      IngotIron: 100
  - type: Stack
    stackType: IngotIronSheet
    baseLayer: icon
    layerStates:
    - icon
    - icon
  - type: Sprite
    state: icon
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    heldPrefix: IngotIronSheet
  - type: Solution
    solution:
      reagents:
      - ReagentId: Iron
        Quantity: 9
      - ReagentId: Carbon
        Quantity: 1
  - type: Tag
    tags:
    - Ingot
    - IngotIron
    - RawMaterial
    - Sheet

- type: entity
  parent: IngotIronSheet
  id: IngotIronSheet10
  name: "железный слиток"
  suffix: 10
  components:
  - type: Sprite
    state: icon
  - type: Stack
    stackType: IngotIronSheet
    count: 10

- type: entity
  parent: IngotIronSheet
  id: IngotIronSheet1
  name: "железный слиток"
  suffix: Single
  components:
  - type: Sprite
    state: icon
  - type: Stack
    stackType: IngotIronSheet
    count: 1


