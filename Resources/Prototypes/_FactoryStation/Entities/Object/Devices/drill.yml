- type: entity
  id: DrillFactoryStation
  parent: BaseItem
  name: бур
  description: Переносной бур для добычи ресурсов с клеток. Для активации нажмите на кнопку "Е" на панели.
  components:
  - type: Sprite
    sprite: Objects/Tools/handdrill.rsi
    state: handdrill
  - type: Item
    size: Large
  - type: Drill
    interval: 5
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Tag
    tags:
    - DrillFactoryStation

  # По желанию – постоянный звук работы (пока включено)
