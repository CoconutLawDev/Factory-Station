- type: entity
  id: DrillFactoryStation
  parent: BaseItem
  name: бур
  description: Переносной бур для добычи ресурсов с клеток. Требует батарейку.
  components:
  - type: Sprite
    sprite: Objects/Tools/handdrill.rsi
    state: handdrill
  - type: Item
    size: Large
  - type: Drill
    interval: 5
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Tag
    tags:
    - DrillFactoryStation
