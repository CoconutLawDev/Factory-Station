- type: entity
  id: DrillFactoryStation
  parent: BaseItem
  name: Промышленная установка для добычи
  description: Промышленная установка для добычи ресурсов с клеток. Требует батарею. Для активации нажмите на кнопку "Е" на панели. Не добывает нефть.
  components:
  - type: Sprite
    sprite: _FactoryStation/Items/devices/drill.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
    - state: burning
      map: ["burning"]
      visible: false
  - type: Item
    size: Large
  - type: Drill
    interval: 5
    whitelist:
      tags:
      - OreIronFact
      - OreCopperFact
      - OreCoal
      - OreSandstoneFact
      - OreCrystal
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Tag
    tags:
    - DrillFactoryStation
  - type: Physics
    bodyType: Dynamic
  - type: Anchorable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DrillVisuals.Running:
        base:
          True: { visible: false }
          False: { visible: true }
        burning:
          True: { visible: true }
          False: { visible: false }

- type: entity
  id: BlackOilDrillFactoryStation
  parent: BaseItem
  name: Нефтяная установка
  description: Переносная установка для добычи нефти и газа. Требует батарейку. Для работы должна быть прикручена к полу. Для активации нажмите на кнопку "Е" на панели.
  components:
  - type: Sprite
    sprite: _FactoryStation/Items/devices/blackoildrill.rsi
    state: icon
    layers:
    - state: icon
      map: ["base"]
    - state: burning
      map: ["burning"]
      visible: false
  - type: Item
    size: Large
  - type: Drill
    interval: 12
    whitelist:
      tags:
      - OilFactory
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Tag
    tags:
    - BlackOilDrillFactoryStation
  - type: Physics
    bodyType: Dynamic
  - type: Anchorable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DrillVisuals.Running:
        base:
          True: { visible: false }
          False: { visible: true }
        burning:
          True: { visible: true }
          False: { visible: false }
