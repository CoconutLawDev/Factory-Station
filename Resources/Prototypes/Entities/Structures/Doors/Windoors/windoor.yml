- type: entity
  id: Windoor
  parent: BaseWindoor
  name: стеклянный шлюз
  description: Это и окно, и раздвижная дверь. Вау!

- type: entity
  id: WindoorSecure
  parent: BaseSecureWindoor
  name: бронированная стеклянный шлюз
  description: Это прочное окно и раздвижная дверь. Вау!

- type: entity
  id: WindoorClockwork
  parent: BaseClockworkWindoor
  name: стеклянный шлюз из часового механизма
  description: Это прочное окно и раздвижная дверь. Вау!

- type: entity
  id: WindoorPlasma
  parent: BasePlasmaWindoor
  name: плазмовая стеклянный шлюз
  description: Это розовое окно *и* раздвижная дверь. Потрясающе!

- type: entity
  id: WindoorSecurePlasma
  parent: BaseSecurePlasmaWindoor
  name: бронированная плазмовая стеклянный шлюз
  description: Это прочное фиолетовое окно *и* раздвижная дверь. Великолепно!

- type: entity
  id: WindoorUranium
  parent: BaseUraniumWindoor
  name: урановая стеклянный шлюз
  description: Это окно и раздвижная дверь. А? О, и она зелёная!

- type: entity
  id: WindoorSecureUranium
  parent: BaseSecureUraniumWindoor
  name: бронированная урановая стеклянный шлюз
  description: Это прочное окно и раздвижная дверь. Она настолько неоново-зелёная, что может даже иметь вкус лайма!

