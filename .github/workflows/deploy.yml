name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build Hybrid ACZ
      run: |
        dotnet run --project RobustToolbox/Robust.Packaging/Robust.Packaging.csproj -- \
          --platform linux-x64 --client false --hybrid-acz true

    - name: Create archive
      run: |
        cd RobustToolbox/bin/Server/linux-x64/publish
        tar -czf server.tar.gz .
        mv server.tar.gz /tmp/

    - name: Upload to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "/tmp/server.tar.gz"
        target: "/tmp/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          systemctl stop factorystation
          rm -rf /opt/factorystation/bin/*
          tar -xzf /tmp/server.tar.gz -C /opt/factorystation/bin/
          rm /tmp/server.tar.gz
          chmod +x /opt/factorystation/bin/Robust.Server
          systemctl start factorystation
