name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build Hybrid ACZ
      run: |
        dotnet run --project RobustToolbox/Robust.Packaging/Robust.Packaging.csproj -- \
          --platform linux-x64 --client false --hybrid-acz true \
          -p:TreatWarningsAsErrors=false -p:NoWarn="CS0618"

    - name: Create archive
      run: |
        cd RobustToolbox/bin/Server/linux-x64/publish
        tar -czf server.tar.gz .
        mv server.tar.gz /tmp/

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Build #${{ github.run_number }}"
        files: /tmp/server.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
