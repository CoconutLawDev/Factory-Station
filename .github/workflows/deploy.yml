name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Server
      run: dotnet build Content.Server/Content.Server.csproj -c Release -p:TreatWarningsAsErrors=false

    - name: Create archive
      run: |
        mkdir -p /tmp/server
        cp -r RobustToolbox/bin/Server/linux-x64/Release/* /tmp/server/ 2>/dev/null || \
        cp -r bin/Server/linux-x64/Release/* /tmp/server/ 2>/dev/null
        tar -czf /tmp/server.tar.gz -C /tmp/server .
        ls -la /tmp/server.tar.gz

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Build #${{ github.run_number }}"
        files: /tmp/server.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
