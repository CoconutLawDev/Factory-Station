name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Server
      run: dotnet build Content.Server/Content.Server.csproj -c Release -p:TreatWarningsAsErrors=false

    - name: Create archive
      run: |
        echo "=== Find output ==="
        find . -path "*/Server/linux-x64/*" -type d 2>/dev/null
        find . -name "Content.Server.dll" -type f 2>/dev/null
        find . -name "Robust.Server" -type f 2>/dev/null
        echo "=== bin/Server ==="
        ls -la bin/Server/linux-x64/ 2>/dev/null || echo "not found"
        echo "=== Content.Server/bin ==="
        ls -la Content.Server/bin/Release/ 2>/dev/null || echo "not found"
        echo "=== RobustToolbox/bin ==="
        ls -la RobustToolbox/bin/Server/ 2>/dev/null || echo "not found"

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Build #${{ github.run_number }}"
        files: /tmp/server.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
