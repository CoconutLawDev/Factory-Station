name: Build and Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build Hybrid ACZ
      run: |
        dotnet run --project RobustToolbox/Robust.Packaging/Robust.Packaging.csproj -- \
          --platform linux-x64 --client false --hybrid-acz true \
          -p:TreatWarningsAsErrors=false

    - name: Find and archive build
      run: |
        SERVER_DIR=$(dirname $(find . -name "Robust.Server" -type f | head -1))
        if [ -z "$SERVER_DIR" ]; then
          echo "ERROR: Robust.Server not found!"
          find . -type d -name "publish" 2>/dev/null
          find . -type d -name "Server" 2>/dev/null
          exit 1
        fi
        echo "Found server in: $SERVER_DIR"
        cd "$SERVER_DIR"
        tar -czf /tmp/server.tar.gz .
        ls -la /tmp/server.tar.gz

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "Build #${{ github.run_number }}"
        files: /tmp/server.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
