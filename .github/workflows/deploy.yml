name: Build and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build Hybrid ACZ
        run: |
          dotnet run \
            --project RobustToolbox/Robust.Packaging/Robust.Packaging.csproj -- \
            --platform linux-x64 \
            --client false \
            --hybrid-acz true \
            -p:TreatWarningsAsErrors=false

      - name: Find build output
        id: locate
        shell: bash
        run: |
          echo "=== Robust.Server files ==="
          find . -name "Robust.Server" -type f || true

          echo "=== ACZ files ==="
          find . -name "*.acz" -type f || true

          SERVER=$(find . -name "Robust.Server" -type f | head -n1)

          if [ -z "$SERVER" ]; then
            echo "Build output not found!"
            exit 1
          fi

          PACK_DIR=$(dirname "$SERVER")

          echo "Found output directory:"
          echo "$PACK_DIR"

          echo "pack_dir=$PACK_DIR" >> "$GITHUB_OUTPUT"

      - name: Create archive
        run: |
          cd "${{ steps.locate.outputs.pack_dir }}"

          tar -czf "$RUNNER_TEMP/server.tar.gz" .

          echo "Archive created:"
          ls -lh "$RUNNER_TEMP/server.tar.gz"

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: ${{ runner.temp }}/server.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
